name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  GO_VERSION: '1.22'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Get dependencies
      run: |
        go mod download
        go mod verify

    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [samlidp, samlproxy, samlclient]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build ${{ matrix.component }}
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/${{ matrix.component }}-arm64 ./cmd/${{ matrix.component }}
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/${{ matrix.component }}-amd64 ./cmd/${{ matrix.component }}
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o bin/${{ matrix.component }}-darwin-arm64 ./cmd/${{ matrix.component }}
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o bin/${{ matrix.component }}-darwin-amd64 ./cmd/${{ matrix.component }}
        ls -la bin/

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.component }}-binaries
        path: bin/*

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [samlidp, samlproxy, samlclient]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.${{ matrix.component }}
        platforms: linux/arm64,linux/amd64
        push: false
        tags: |
          saml-tools/${{ matrix.component }}:latest
          saml-tools/${{ matrix.component }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Run gosec security scanner
      uses: securego/gosec@master
      with:
        args: './...'
      continue-on-error: true